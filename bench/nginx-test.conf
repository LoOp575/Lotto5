# Target uji lokal untuk bench/header_bench.py
#
# nginx 1.26.3, dibangun tanpa PCRE/zlib/OpenSSL:
#   ./auto/configure --prefix=/tmp/nginx-inst \
#       --without-http_rewrite_module --without-http_gzip_module
#   make -j"$(nproc)" && make install
#
# Jalankan:
#   /tmp/nginx-inst/sbin/nginx -c bench/nginx-test.conf -p /tmp/nginx-inst -g 'daemon off;'
# lalu:
#   python3 bench/header_bench.py --port 8080 --mode keepalive

worker_processes 1;
error_log /tmp/nginx-inst/logs/error.log warn;   # 'info' akan mencatat header invalid
pid /tmp/nginx-inst/logs/nginx.pid;

events { worker_connections 1024; }

http {
    access_log off;
    default_type text/plain;

    # Batas nyata jumlah header yang bisa masuk (default nginx):
    # baris request + seluruh header maksimum 4 x 8 KB = 32 KB.
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    server {
        listen 127.0.0.1:8080 default_server;
        server_name _;
        root /tmp/www;      # berisi index.html kecil

        location / {
            # POST ke file statis akan dijawab 405. Pakai GET untuk 200,
            # atau aktifkan baris error_page di bawah.
            # error_page 405 =200 /index.html;
        }
    }
}
